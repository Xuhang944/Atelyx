<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#D4AF37" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#1C1C1E"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <rect x="24" y="24" width="1232" height="672" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="60" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#D4AF37" letter-spacing="2">ATELYX</text>
  <text x="1220" y="70" text-anchor="end" font-family="'Segoe UI', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#8b8b8b">笔记 · 实时预览与反链</text>

  <g font-family="'Segoe UI', 'PingFang SC', Arial, sans-serif">
    <!-- note editor panel -->
    <rect x="60" y="120" width="810" height="508" rx="8" fill="#17171a" stroke="#2a2a2e"/>
    <!-- tab -->
    <rect x="60" y="120" width="200" height="30" rx="8" fill="#202024"/>
    <text x="80" y="140" font-size="12.5" font-weight="600" fill="#E5E0D5">剧本大纲 · 第一幕</text>
    <text x="244" y="140" font-size="13" fill="#8b8b8b">×</text>
    <text x="1200" y="140" text-anchor="end" font-size="12" fill="#6a6a6e">已自动保存</text>

    <!-- mode toggles -->
    <rect x="80" y="162" width="86" height="26" rx="6" fill="#D4AF37"/>
    <text x="123" y="179" text-anchor="middle" font-size="12" font-weight="600" fill="#1C1C1E">预览</text>
    <rect x="174" y="162" width="106" height="26" rx="6" fill="none" stroke="#5a5a5e"/>
    <text x="227" y="179" text-anchor="middle" font-size="12" fill="#9a9a9e">实时预览</text>
    <rect x="288" y="162" width="70" height="26" rx="6" fill="none" stroke="#5a5a5e"/>
    <text x="323" y="179" text-anchor="middle" font-size="12" fill="#9a9a9e">源码</text>
    <text x="1180" y="179" text-anchor="end" font-size="12" fill="#8b8b8b">项目A / 剧本大纲.md</text>

    <!-- note content -->
    <text x="80" y="238" font-size="25" font-weight="700" fill="#E5E0D5">剧本大纲 · 第一幕</text>
    <text x="80" y="268" font-size="13" fill="#b5b5ba">雨夜的家中，镜头从暖黄的灯光缓慢下摇，落到</text>
    <text x="80" y="289" font-size="13" fill="#b5b5ba">坐在窗边发呆的角色身上。</text>

    <rect x="80" y="306" width="470" height="62" rx="6" fill="#1f1f21" stroke="#2a2a2e"/>
    <rect x="80" y="306" width="3.5" height="62" fill="#D4AF37"/>
    <text x="100" y="329" font-size="12.5" font-weight="600" fill="#D4AF37">&gt; [!note] 关键道具</text>
    <text x="100" y="351" font-size="12.5" fill="#dcdcdc">一条褪色的围巾——贯穿全篇的线索。</text>

    <text x="80" y="398" font-size="13" fill="#dcdcdc">1. 开场：固定中景，窗外的雨声渐强</text>
    <text x="80" y="421" font-size="13" fill="#dcdcdc">2. 钩子：角色抬头，与镜头对视</text>
    <text x="80" y="452" font-size="13" fill="#8b8b8b">后续参考：</text>
    <text x="158" y="452" font-size="13" fill="#D4AF37">[[分镜方案]]</text>

    <!-- mini table: structure -->
    <rect x="80" y="472" width="540" height="76" rx="6" fill="#19191b" stroke="#2a2a2e"/>
    <rect x="80" y="472" width="540" height="24" rx="6" fill="#202024"/>
    <text x="96" y="489" font-size="11.5" font-weight="600" fill="#8b8b8b">一栏 / 内容</text>
    <text x="260" y="489" font-size="11.5" font-weight="600" fill="#8b8b8b">用途</text>
    <text x="96" y="519" font-size="11.5" fill="#dcdcdc">1. 文本</text>
    <text x="260" y="519" font-size="11.5" fill="#dcdcdc">分镜脚本</text>
    <text x="96" y="539" font-size="11.5" fill="#dcdcdc">2. 表格</text>
    <text x="260" y="539" font-size="11.5" fill="#dcdcdc">台词 / 镜头表</text>

    <!-- backlinks card -->
    <rect x="80" y="566" width="540" height="48" rx="6" fill="#202024" stroke="#2a2a2e"/>
    <text x="98" y="587" font-size="12.5" font-weight="600" fill="#D4AF37">反向链接</text>
    <text x="160" y="587" font-size="11.5" fill="#8b8b8b">暂无引用</text>
    <text x="98" y="604" font-size="11" fill="#6a6a6e">点击跳转引用方</text>

    <!-- AI chat panel -->
    <rect x="890" y="120" width="330" height="508" rx="8" fill="#17171a" stroke="#2a2a2e"/>

    <!-- sample conversation : Agent capability (multiple thinking + tool calls) -->
    <rect x="976" y="148" width="214" height="32" rx="8" fill="#2b2b30"/>
    <text x="1174" y="168" text-anchor="end" font-size="11.5" fill="#dcdcdc">把分镜改成紧凑的雨夜开场</text>

    <!-- thinking 1 -->
    <rect x="914" y="188" width="282" height="36" rx="8" fill="#17171a" stroke="#2a2a2e"/>
    <text x="926" y="210" font-size="10.5" font-weight="600" fill="#D4AF37">▸ 思考过程</text>
    <rect x="1030" y="196" width="92" height="6" rx="3" fill="#2f2f33"/>
    <rect x="1030" y="206" width="64" height="6" rx="3" fill="#2f2f33"/>
    <text x="1184" y="210" text-anchor="end" font-size="10" fill="#6a6a6e">展开</text>

    <!-- tool 1 -->
    <rect x="914" y="234" width="282" height="28" rx="6" fill="#1c1c1e" stroke="#2a2a2e"/>
    <circle cx="932" cy="248" r="4" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
    <path d="M 930 246 L 934 250 M 934 246 L 930 250" stroke="#D4AF37" stroke-width="1"/>
    <text x="944" y="252" font-size="10.5" fill="#dcdcdc">联网检索 · 运镜参考</text>
    <text x="1184" y="252" text-anchor="end" font-size="10.5" fill="#8b8b8b">3 条</text>

    <!-- tool 2 : found knowledge md -->
    <rect x="914" y="272" width="282" height="28" rx="6" fill="#1c1c1e" stroke="#2a2a2e"/>
    <circle cx="932" cy="286" r="4" fill="none" stroke="#8a7440" stroke-width="1.2"/>
    <path d="M 930 284 L 934 288 M 934 284 L 930 288" stroke="#8a7440" stroke-width="1"/>
    <text x="944" y="290" font-size="10.5" fill="#dcdcdc">全文检索 · 知识库</text>
    <text x="1184" y="290" text-anchor="end" font-size="10.5" fill="#dcdcdc">✓ 相关知识.md</text>

    <!-- thinking 2 -->
    <rect x="914" y="310" width="282" height="36" rx="8" fill="#17171a" stroke="#2a2a2e"/>
    <text x="926" y="332" font-size="10.5" font-weight="600" fill="#D4AF37">▸ 思考过程</text>
    <rect x="1030" y="318" width="88" height="6" rx="3" fill="#2f2f33"/>
    <rect x="1030" y="328" width="56" height="6" rx="3" fill="#2f2f33"/>
    <text x="1184" y="332" text-anchor="end" font-size="10" fill="#6a6a6e">展开</text>

    <!-- tool 3 : read the knowledge md -->
    <rect x="914" y="356" width="282" height="28" rx="6" fill="#1c1c1e" stroke="#2a2a2e"/>
    <circle cx="932" cy="370" r="4" fill="none" stroke="#8a7440" stroke-width="1.2"/>
    <path d="M 930 368 L 934 372 M 934 368 L 930 372" stroke="#8a7440" stroke-width="1"/>
    <text x="944" y="374" font-size="10.5" fill="#dcdcdc">读取 · 相关知识.md</text>
    <text x="1184" y="374" text-anchor="end" font-size="10.5" fill="#dcdcdc">✓</text>

    <!-- final reply -->
    <rect x="914" y="394" width="276" height="84" rx="8" fill="#1f1f21"/>
    <rect x="914" y="394" width="3" height="84" fill="#D4AF37"/>
    <text x="928" y="416" font-size="11" fill="#dcdcdc">已结合「相关知识.md」，算出 3 条运镜参考：</text>
    <text x="928" y="432" font-size="11" fill="#dcdcdc">建议轨道车缓推、把焦点从伞尖移到眼睛，用</text>
    <text x="928" y="448" font-size="11" fill="#dcdcdc">脚步声堆叠张力；已把要点写入「分镜脚本.atlx」。</text>

    <!-- composer -->
    <rect x="906" y="556" width="298" height="68" rx="10" fill="#202024" stroke="#2a2a2e"/>
    <text x="926" y="580" font-size="12.5" fill="#8b8b8b">对话</text>
    <rect x="926" y="588" width="222" height="30" rx="15" fill="#1a1a1d" stroke="#D4AF37"/>
    <text x="938" y="608" font-size="11.5" fill="#dcdcdc">模型: <tspan fill="#E5E0D5" font-weight="600">deepseek</tspan><tspan fill="#6a6a6e"> / </tspan><tspan fill="#9a9a9e">推理等级: </tspan><tspan fill="#E5E0D5" font-weight="600">高</tspan></text>
    <text x="1136" y="608" text-anchor="end" font-size="10" fill="#6a6a6e">▾</text>
    <rect x="1164" y="588" width="28" height="30" rx="8" fill="#D4AF37"/>
    <path d="M 1174 603 L 1184 603 M 1179 598 L 1179 608" stroke="#1C1C1E" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
