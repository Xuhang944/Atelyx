<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 空 favicon：避免控制台 favicon.ico 404 -->
    <link rel="icon" href="data:," />
    <!-- CSP：本地单用户应用，connect-src 放宽允许任意 http/https，
         以兼容自建 Ollama、局域网 API、SearXNG 等。
         http://ipc.localhost 是 Tauri 2 的 IPC 协议地址，必须允许。-->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https: http:; connect-src 'self' http: https: http://ipc.localhost; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>Atelyx</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
