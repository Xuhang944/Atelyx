[package]
name = "collab-relay"
version = "0.1.0"
edition = "2021"
description = "Atelyx 局域网协作中转：无状态 WebSocket hub，按仓库转发 presence（在线用户 + 选中状态）"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3.31", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
