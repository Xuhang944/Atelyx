services:
  relay:
    build: .
    container_name: atelyx-collab-relay
    restart: unless-stopped
    environment:
      - PORT=17701
      # 日志级别（默认 info；调试看转发明细用 collab_relay=debug）
      - RUST_LOG=${RUST_LOG:-info}
      # 可选：json 切结构化行输出，便于 docker logs 采集
      - LOG_FORMAT=${LOG_FORMAT:-}
    ports:
      - "17701:17701"
